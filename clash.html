<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>xStats &mdash; Rating Clash (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f0ec; --surface:#ffffff; --surface-2:#f7f7f4;
  --ink:#111111; --ink-2:#4a4a4a; --muted:#878787; --line:#e2e2de; --line-strong:#c9c9c3;
  --brand:#7a3fd1; --brand-ink:#5f2eb0; --brand-wash:#f1ecfb;
  --fm:#ea3323; --fm-wash:#fdeceb; --ss:#e6007a; --ss-wash:#fde7f1;
  --shadow-card:0 1px 2px rgba(17,17,17,0.04), 0 8px 20px -14px rgba(17,17,17,0.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Roboto',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.disp{font-family:'Barlow Condensed',sans-serif}
.demo-flag{background:#1a1a1a;color:#ffd166;text-align:center;font-size:11px;font-weight:700;padding:5px;letter-spacing:0.04em;text-transform:uppercase}

.masthead{background-color:#121212;background-image:radial-gradient(circle,rgba(255,255,255,0.07) 1px,transparent 1px);
  background-size:18px 18px;border-bottom:3px solid var(--brand)}
.pagehead{max-width:1200px;margin:0 auto;padding:20px 28px}
.brand{display:flex;align-items:baseline;gap:9px}
.brand-mark{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:19px;letter-spacing:-0.01em;color:#fff}
.brand-mark .x{color:var(--fm)}
.brand-sub{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.4)}
.back-link{color:rgba(255,255,255,0.6);font-size:11.5px;font-weight:700;margin-left:auto}
.ph-top{display:flex;align-items:center;gap:16px}
h1{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;color:#fff;margin-top:14px}
.ph-sub{font-size:12.5px;color:rgba(255,255,255,0.6);margin-top:4px;max-width:640px;line-height:1.5}

.app{max-width:1200px;margin:0 auto;padding:20px 28px 60px}
.tabs{display:flex;gap:4px;margin-bottom:14px}
.tab{background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:0 16px;height:38px;
  font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.tab.on.fm{background:var(--fm);border-color:var(--fm);color:#fff}
.tab.on.ss{background:var(--ss);border-color:var(--ss);color:#fff}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.toolbar select{height:36px;border:1px solid var(--line-strong);border-radius:4px;padding:0 28px 0 10px;font:inherit;font-size:12.5px;
  font-weight:600;background:var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="%23868da3" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>') no-repeat right 9px center;
  cursor:pointer;appearance:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.ccard{background:var(--surface);border:1px solid var(--line-strong);border-radius:5px;box-shadow:var(--shadow-card);
  padding:14px;cursor:pointer;transition:transform .1s}
.ccard:hover{transform:translateY(-1px)}
.ctop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--surface-2);flex-shrink:0;border:1px solid var(--line)}
.avatar-ph{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;color:#fff}
.cname{font-weight:700;font-size:13px}
.cteam{font-size:10.5px;color:var(--muted)}
.cbars{display:flex;flex-direction:column;gap:5px}
.cbrow{display:grid;grid-template-columns:30px 1fr 36px;align-items:center;gap:8px}
.cbrow .lbl{font-size:9.5px;font-weight:800;color:var(--muted)}
.cbtrack{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.cbfill{height:100%;border-radius:4px}
.cbfill.fm{background:var(--fm)}
.cbfill.ss{background:var(--ss)}
.cbval{font-size:11.5px;font-weight:800;text-align:right}
.cdiff{margin-top:8px;text-align:center;font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;display:inline-block}
.cdiff.fm{background:var(--fm-wash);color:var(--fm)}
.cdiff.ss{background:var(--ss-wash);color:var(--ss)}
.cwrap{text-align:center}
.empty{padding:60px;text-align:center;color:var(--muted);font-size:13px;grid-column:1/-1}
</style>
</head>
<body>
<div class="demo-flag">DEMO &mdash; Choque de Ratings Fotmob vs Sofascore (prototipo, no enlazado aún)</div>
<div class="masthead">
  <div class="pagehead">
    <div class="ph-top">
      <div class="brand"><span class="brand-mark"><span class="x">x</span>Stats</span><span class="brand-sub">Rating Clash</span></div>
      <a class="back-link" href="fotmob_leaderboard.html">&larr; Volver al buscador</a>
    </div>
    <h1>¿Dónde discrepan Fotmob y Sofascore?</h1>
    <p class="ph-sub" id="count-sub">Jugadores cruzados entre ambas fuentes, ordenados por la mayor diferencia entre su rating Fotmob y su rating Sofascore.</p>
  </div>
</div>

<div class="app">
  <div class="tabs">
    <button class="tab on fm" data-side="fm" onclick="setSide('fm',this)">🔴 Fotmob los puntúa más alto</button>
    <button class="tab" data-side="ss" onclick="setSide('ss',this)">🩷 Sofascore los puntúa más alto</button>
  </div>
  <div class="toolbar">
    <select id="league-sel"><option value="">Todas las ligas</option></select>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const AVATAR_BG = ['#1f4ea8','#0f7a4e','#b3261e','#92660c','#6d3fae','#1a7f8e','#a1472e','#3a5a9e'];
function avatarColor(name){ let h=0; for(const c of (name||'?')) h=(h*31+c.charCodeAt(0))>>>0; return AVATAR_BG[h%AVATAR_BG.length]; }

let DATA=[], SIDE='fm';

fetch('data/merged_index.json').then(r=>r.json()).then(d=>{
  DATA = d.filter(p=>typeof p.id==='number' && p.fotmob_rating!=null && p.sofascore_rating!=null)
          .map(p=>({...p, diff: +(p.fotmob_rating - p.sofascore_rating).toFixed(2)}));
  $('count-sub').textContent = `${DATA.length.toLocaleString()} jugadores cruzados entre ambas fuentes, ordenados por la mayor diferencia entre su rating Fotmob y su rating Sofascore.`;
  const leagues=[...new Set(DATA.map(p=>p.league).filter(Boolean))].sort();
  $('league-sel').innerHTML += leagues.map(l=>`<option value="${l}">${l}</option>`).join('');
  $('league-sel').addEventListener('change', render);
  render();
});

function setSide(side, btn){
  SIDE = side;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function render(){
  const lg = $('league-sel').value;
  let rows = DATA.filter(p=>!lg || p.league===lg);
  rows = rows.filter(p=> SIDE==='fm' ? p.diff>0 : p.diff<0);
  rows.sort((a,b)=> SIDE==='fm' ? b.diff-a.diff : a.diff-b.diff);
  rows = rows.slice(0,60);

  if(!rows.length){ $('grid').innerHTML = `<div class="empty">Sin resultados para este filtro.</div>`; return; }

  const maxR = 10;
  $('grid').innerHTML = rows.map(p=>{
    const initials=(p.name||'?').split(' ').map(s=>s[0]).filter(Boolean).slice(-2).join('');
    const avCol = avatarColor(p.name);
    const photoHtml = p.photo ? `<img class="avatar" src="${p.photo}" onerror="this.outerHTML='<div class=\\'avatar-ph\\' style=\\'background:${avCol}\\'>${initials}</div>'">`
      : `<div class="avatar-ph" style="background:${avCol}">${initials}</div>`;
    return `<div class="ccard" onclick="location.href='fotmob_player.html?id=${p.id}'">
      <div class="ctop">${photoHtml}<div><div class="cname">${p.name}</div><div class="cteam">${p.team||'—'} · ${p.league||''}</div></div></div>
      <div class="cbars">
        <div class="cbrow"><div class="lbl">FM</div><div class="cbtrack"><div class="cbfill fm" style="width:${p.fotmob_rating/maxR*100}%"></div></div><div class="cbval">${p.fotmob_rating.toFixed(2)}</div></div>
        <div class="cbrow"><div class="lbl">SS</div><div class="cbtrack"><div class="cbfill ss" style="width:${p.sofascore_rating/maxR*100}%"></div></div><div class="cbval">${p.sofascore_rating.toFixed(2)}</div></div>
      </div>
      <div class="cwrap"><span class="cdiff ${SIDE}">${SIDE==='fm'?'+':''}${p.diff} dif.</span></div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
