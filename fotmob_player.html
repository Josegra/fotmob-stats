<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>xStats &mdash; Player Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   TOKENS
   Chrome colors are this page's own brand (FiveThirtyEight-inspired red).
   Data-encoding colors (percentile sequential heat ramp, shot-outcome status
   set) follow the same warm cream->orange->red intensity scale used across
   the app, per explicit user design direction (2026-10-04).
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#f0f0ec; --surface:#ffffff; --surface-2:#f7f7f4;
  --ink:#111111; --ink-2:#4a4a4a; --muted:#878787; --line:#e2e2de; --line-2:#ececea;
  --brand:#ea3323; --brand-ink:#b31c10; --brand-wash:#fdeceb;
  --gold:#b8860b; --gold-wash:#fbf3e1;
  --pos-fw:#e34948; --pos-mf:#2a78d6; --pos-df:#0e7c53; --pos-gk:#c98500;
  --div-hi:#2a78d6; --div-hi-wash:#eaf2fc; --div-mid:#c3c2b7; --div-lo:#e34948; --div-lo-wash:#fceaea;
  --seq-100:#cde2fb; --seq-250:#86b6ef; --seq-400:#3987e5; --seq-550:#1c5cab; --seq-700:#0d366b;
  --status-good:#1a8a4a; --status-crit:#d6362a; --status-neutral:#9aa0a2;
  --shadow-1:0 1px 2px rgba(17,17,17,0.05), 0 1px 1px rgba(17,17,17,0.04);
  --shadow-2:0 10px 30px -14px rgba(0,0,0,0.35);
  --radius:5px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Roboto',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.disp{font-family:'Barlow Condensed',sans-serif}
.mono{font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d7dad5;border-radius:4px}

/* ─── NAV ─────────────────────────────────────────────────────────────── */
.nav{position:sticky;top:0;z-index:200;background:#0b0e0c;color:#fff;
  display:flex;align-items:center;gap:16px;padding:0 24px;height:52px}
.nav-mark{font-family:'Barlow Condensed',sans-serif;display:flex;align-items:baseline;gap:7px;font-weight:900;font-size:16px;letter-spacing:-0.02em;flex-shrink:0;color:#fff}
.nav-mark .x{color:var(--brand)}
.nav-mark .sub{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.4)}
.nav-back{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:rgba(255,255,255,0.7);
  padding:6px 12px;border:1px solid rgba(255,255,255,0.18);border-radius:4px;cursor:pointer;transition:all .15s;background:transparent;flex-shrink:0}
.nav-back:hover{border-color:rgba(255,255,255,0.4);color:#fff}
.nav-search{flex:1;max-width:400px;position:relative;margin-left:auto}
.nav-search input{width:100%;height:34px;border:1px solid rgba(255,255,255,0.18);border-radius:4px;padding:0 14px 0 34px;
  font:inherit;font-size:13px;background:rgba(255,255,255,0.06);transition:all .15s;color:#fff}
.nav-search input::placeholder{color:rgba(255,255,255,0.4)}
.nav-search input:focus{outline:none;border-color:var(--brand);background:rgba(255,255,255,0.1)}
.nav-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:rgba(255,255,255,0.4);pointer-events:none}
.sr-pop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:4px;box-shadow:var(--shadow-2);max-height:360px;overflow-y:auto;display:none;z-index:50}
.sr-pop.show{display:block}
.sr-row{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;transition:background .1s}
.sr-row:hover,.sr-row.sel{background:var(--surface-2)}
.sr-name{font-size:12.5px;font-weight:600;color:var(--ink)}
.sr-sub{font-size:11px;color:var(--muted)}
.sr-mv{margin-left:auto;font-size:11px;font-weight:700;color:var(--brand-ink)}

/* sticky section sub-nav */
.subnav{position:sticky;top:56px;z-index:150;background:rgba(243,244,242,0.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 24px;overflow-x:auto}
.subnav a{font-size:11.5px;font-weight:700;letter-spacing:0.02em;color:var(--ink-2);padding:12px 14px 10px;
  border-bottom:2.5px solid transparent;white-space:nowrap;transition:all .15s}
.subnav a:hover{color:var(--ink)}
.subnav a.on{color:var(--brand-ink);border-bottom-color:var(--brand)}

.wrap{max-width:1180px;margin:0 auto;padding:20px 24px 80px}
.loading,.notfound{padding:120px 24px;text-align:center;color:var(--muted);font-size:13px}

/* ─── HERO HEADER ─────────────────────────────────────────────────────── */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-1);
  padding:26px 28px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.hero-photo-wrap{position:relative;flex-shrink:0}
.hero-photo{width:112px;height:112px;border-radius:6px;object-fit:cover;background:var(--surface-2);
  border:1px solid var(--line);display:block}
.hero-photo-ph{width:112px;height:112px;border-radius:6px;background:linear-gradient(135deg,var(--brand-wash),#fff);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;
  color:var(--brand-ink)}
.pos-dot{position:absolute;bottom:-5px;right:-5px;width:28px;height:18px;border-radius:3px;display:flex;
  align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;border:2.5px solid var(--surface)}
.hero-info{flex:1;min-width:240px}
.hero-name{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.02em;line-height:1.08;margin-bottom:6px}
.hero-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--ink-2)}
.hero-meta b{color:var(--ink);font-weight:600}
.badge{display:inline-flex;align-items:center;padding:2.5px 8px;border-radius:3px;font-size:10.5px;font-weight:700;
  letter-spacing:0.02em;color:#fff}
.chip-row{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:5px 10px;font-size:11px;color:var(--ink-2)}
.season-pills{display:flex;gap:6px;margin-top:9px}
.season-pill{font-family:'Roboto',sans-serif;font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:20px;
  border:1px solid var(--line-strong);color:var(--ink-2);background:#fff;transition:all .12s}
.season-pill:hover{border-color:var(--brand-ink);color:var(--brand-ink)}
.season-pill.on{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.chip b{color:var(--ink);font-weight:700}

.hero-stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;flex-shrink:0}
.hstat{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:12px 18px;text-align:center;min-width:92px}
.hstat-lbl{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.hstat-val{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.01em;color:var(--ink)}
.hstat-sub{font-size:10px;color:var(--muted);margin-top:3px}
.hstat.rating .hstat-val{color:var(--brand-ink)}
.ring{width:46px;height:46px;margin:0 auto 4px}

/* ─── CARD SHELL ──────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-1);
  margin-bottom:14px;overflow:hidden;scroll-margin-top:118px}
.card-hd{padding:14px 20px;border-bottom:2px solid var(--ink);display:flex;align-items:baseline;justify-content:space-between;
  flex-wrap:wrap;gap:10px}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase}
.card-sub{font-size:11px;color:var(--muted)}
.card-body{padding:18px 20px}
.empty-state{padding:48px 20px;text-align:center;color:var(--muted);font-size:12.5px}

/* ─── MARKET VALUE ────────────────────────────────────────────────────── */
.mv-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.mv-now{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;color:var(--ink)}
.mv-delta{font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px}
.mv-delta.up{color:var(--status-good);background:#eafaea}
.mv-delta.down{color:var(--status-crit);background:#fdecec}
.mv-date{font-size:11px;color:var(--muted);margin-left:auto}
.mv-range{display:flex;gap:4px}
.rbtn{background:#fff;border:1px solid var(--line-strong,var(--line));border-radius:3px;padding:4px 10px;font-size:10.5px;font-weight:700;
  color:var(--ink-2);cursor:pointer;font-family:inherit;transition:all .15s}
.rbtn:hover{border-color:#c7cac5}
.rbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
canvas#mv-canvas{width:100%;height:260px;display:block;cursor:crosshair}
.mv-tip{position:absolute;background:var(--ink);color:#fff;font-size:11px;padding:7px 10px;border-radius:6px;
  pointer-events:none;white-space:nowrap;transform:translate(-50%,-125%);opacity:0;transition:opacity .12s,transform .12s;z-index:10;
  box-shadow:0 8px 20px -6px rgba(0,0,0,0.4);line-height:1.5}
.mv-tip b{font-size:13px}
.mv-tip .mvt-delta{font-size:10px;font-weight:700}
.mv-wrap{position:relative}
.mv-callout{position:absolute;pointer-events:none;opacity:0;transition:opacity .25s ease .1s,transform .25s ease .1s;
  transform:translate(10px,-50%) scale(0.92);z-index:5}
.mv-callout.show{opacity:1;transform:translate(10px,-50%) scale(1)}
.mv-callout-box{background:#fff;border:1.5px solid var(--brand-ink);border-radius:7px;padding:6px 11px;box-shadow:0 6px 18px -8px rgba(10,94,63,0.4);
  white-space:nowrap}
.mv-callout-val{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;color:var(--brand-ink);line-height:1.1}
.mv-callout-lbl{font-size:8.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em}

/* ─── PERCENTILE EXPLORER (ring grid) ─────────────────────────────────── */
.grp-tabs{display:flex;border:1px solid var(--line-strong,#c7cac5);border-radius:4px;overflow:hidden;
  width:fit-content;margin:16px 20px 0;flex-wrap:wrap}
.gtab{background:#fff;border:none;border-right:1px solid var(--line-strong,#c7cac5);padding:8px 15px;font-size:10.5px;
  font-weight:700;letter-spacing:0.02em;color:var(--ink-2);cursor:pointer;transition:all .1s;font-family:inherit}
.gtab:last-child{border-right:none}
.gtab:hover{background:var(--surface-2);color:var(--ink)}
.gtab.on{background:var(--ink);color:#fff}
.pct-legend{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:600;color:var(--muted);padding:16px 20px 0;
  letter-spacing:0.03em;text-transform:uppercase}
.pct-legend .lg-bar{width:120px;height:5px;border-radius:3px;background:linear-gradient(90deg,#ffffff,#ffc98c,#c92319)}
.pct-grid{padding:14px 20px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:4px 2px}
.ring-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 6px 12px;
  border-radius:4px;transition:background .12s}
.ring-card:hover{background:var(--surface-2)}
.ring-svg{width:84px;height:84px;position:relative}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.ring-num b{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:-0.02em;line-height:1;font-variant-numeric:tabular-nums}
.ring-num span{font-size:8px;font-weight:700;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;margin-top:2px}
.ring-label{font-size:11px;font-weight:700;color:var(--ink);margin-top:9px;line-height:1.2}
.ring-detail{font-size:10px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.ring-detail b{color:var(--ink-2);font-weight:700}

/* ─── PITCH MAPS ──────────────────────────────────────────────────────── */
.map-grid{display:grid;grid-template-columns:1fr 220px;gap:0}
.map-canvas-wrap{padding:16px;background:#0d1f14;position:relative}
canvas.pitch-cv{width:100%;display:block;border-radius:4px}
.map-side{padding:18px 16px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px}
.mside-stat{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line-2)}
.mside-stat:last-child{border-bottom:none}
.mside-lbl{font-size:10.5px;color:var(--muted)}
.mside-val{font-size:13px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.third-bars{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.third-row{display:flex;align-items:center;gap:8px}
.third-lbl{font-size:9.5px;color:var(--muted);width:34px;flex-shrink:0}
.third-track{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.third-fill{height:100%;border-radius:3px;background:var(--seq-400)}
.third-pct{font-size:10px;font-weight:700;color:var(--ink-2);width:34px;text-align:right;flex-shrink:0}

.shot-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));background:var(--line-2);
  border-bottom:1px solid var(--line-2);gap:1px}
.shot-stat-tile{background:var(--surface);padding:13px 14px 12px;text-align:center}
.shot-stat-tile .v{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.shot-stat-tile .l{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:5px}
.shot-filters{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px 0;background:#0d1f14}
.sf-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);
  border-radius:4px;padding:5px 12px 5px 9px;font-size:10.5px;font-weight:600;color:rgba(255,255,255,0.65);cursor:pointer;
  transition:all .15s;font-family:inherit}
.sf-chip .sw{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.sf-chip.on{background:rgba(255,255,255,0.14);color:#fff;border-color:rgba(255,255,255,0.3)}
.shot-tip{position:absolute;background:var(--ink);color:#fff;font-size:11px;padding:8px 10px;border-radius:4px;
  pointer-events:none;opacity:0;transition:opacity .1s;z-index:20;line-height:1.5;max-width:200px}
.shot-tip b{color:#fff}
.shot-legend{display:flex;align-items:center;justify-content:center;gap:22px;padding:4px 0 14px;background:#0d1f14}
.shot-legend .lg-item{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;color:rgba(255,255,255,0.55);
  text-transform:uppercase;letter-spacing:0.05em}
.shot-legend .lg-dot{border-radius:50%;background:rgba(255,255,255,0.3);border:1px solid rgba(255,255,255,0.55);flex-shrink:0}
.shot-legend .lg-sep{width:1px;height:14px;background:rgba(255,255,255,0.15)}

@media(max-width:820px){
  .map-grid{grid-template-columns:1fr}
  .map-side{border-left:none;border-top:1px solid var(--line-2)}
  .hero-stats{margin-left:0;width:100%}
  .prow{grid-template-columns:110px 1fr 40px 54px 54px;gap:8px}
  .pcols-hd{grid-template-columns:110px 1fr 40px 54px 54px;gap:8px}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-mark"><span><span class="x">x</span>Stats</span><span class="sub">Player Report</span></div>
  <div class="nav-back" onclick="history.length>1?history.back():location.href='fotmob_leaderboard.html'">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    Back
  </div>
  <div class="nav-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search-input" type="text" placeholder="Search a player…" autocomplete="off">
    <div class="sr-pop" id="search-pop"></div>
  </div>
</nav>

<div class="subnav" id="subnav" style="display:none">
  <a href="#sec-value">Market Value</a>
  <a href="#sec-scout">Scouting Report</a>
  <a href="#sec-heat">Heat Map</a>
  <a href="#sec-shots">Shot Map</a>
</div>

<div class="wrap" id="wrap">
  <div class="loading" id="loading">Loading player…</div>
</div>

<script>
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const PID = qs.get('id');

const POS_COLOR = {
  'Striker':'var(--pos-fw)','Left Winger':'var(--pos-fw)','Right Winger':'var(--pos-fw)',
  'Centre-Back':'var(--pos-df)','Left-Back':'var(--pos-df)','Right-Back':'var(--pos-df)',
  'Left Wing-Back':'var(--pos-df)','Right Wing-Back':'var(--pos-df)',
  'Goalkeeper':'var(--pos-gk)',
};
function posColor(pos){ return POS_COLOR[pos] || 'var(--pos-mf)'; }
function posAbbr(pos){
  if(!pos) return '—';
  if(pos==='Goalkeeper') return 'GK';
  if(pos.includes('Back')) return 'DF';
  if(pos.includes('Midfield')) return 'MF';
  return 'FW';
}
function fmtM(v){
  if(v==null) return '—';
  const a=Math.abs(v);
  if(a>=1e9) return '€'+(v/1e9).toFixed(2)+'B';
  if(a>=1e6) return '€'+(v/1e6).toFixed(1)+'M';
  if(a>=1e3) return '€'+(v/1e3).toFixed(0)+'K';
  return '€'+v;
}
function fmtNum(v,d=0){ return v==null ? '—' : (+v).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d}); }
// Sequential heat ramp, same cream->orange->red language as the leaderboard's
// stat-cell fills — but this one draws on white (ring stroke + number text),
// so it keeps a dark-gray floor instead of fading to near-white at low pct.
const HEAT_STOPS_FG = [[0,90,90,90],[35,214,150,60],[65,237,110,52],[100,201,35,25]];
function heatRgbFg(p){
  p = Math.max(0,Math.min(100,p));
  for(let i=0;i<HEAT_STOPS_FG.length-1;i++){
    const [t0,r0,g0,b0]=HEAT_STOPS_FG[i], [t1,r1,g1,b1]=HEAT_STOPS_FG[i+1];
    if(p>=t0 && p<=t1){ const f=(p-t0)/(t1-t0); return [r0+(r1-r0)*f, g0+(g1-g0)*f, b0+(b1-b0)*f]; }
  }
  return HEAT_STOPS_FG[HEAT_STOPS_FG.length-1].slice(1);
}
function pctColor(p){
  if(p==null) return 'var(--status-neutral)';
  const c=heatRgbFg(p); return `rgb(${c[0].toFixed(0)},${c[1].toFixed(0)},${c[2].toFixed(0)})`;
}

let PLAYER=null, VALUATIONS=null, MV_PTS=[], MV_RANGE='all', ACTIVE_GROUP=0;
let SHOT_FILTERS={goal:true,saved:true,blocked:true,miss:true};

fetch(`data/fotmob/${PID}.json`)
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>{ PLAYER=d; render(); })
  .catch(()=>{ $('wrap').innerHTML = `<div class="notfound">Player not found. <a href="index.html" style="color:var(--brand);font-weight:700">Back to index →</a></div>`; });

function render(){
  const b = PLAYER.bio;
  document.title = `${b.name} — xStats`;
  $('subnav').style.display='flex';

  const initials = (b.name||'?').split(' ').map(s=>s[0]).filter(Boolean).slice(-2).join('');
  const photoHtml = `<img class="hero-photo" src="${b.photo_url}" onerror="this.outerHTML='<div class=\\'hero-photo-ph\\'>${initials}</div>'">`;

  $('wrap').innerHTML = `
    <div class="hero">
      <div class="hero-photo-wrap">
        ${photoHtml}
        <div class="pos-dot" style="background:${posColor(b.position)}">${posAbbr(b.position)}</div>
      </div>
      <div class="hero-info">
        <div class="hero-name">${b.name}</div>
        <div class="hero-meta">
          <span class="badge" style="background:${posColor(b.position)}">${b.position||'—'}</span>

/* ══════════════ MARKET VALUE ══════════════ */
function renderMarketValue(){
  if(!PLAYER.bio.has_valuation_history){
    $('mv-body').innerHTML = `<div class="empty-state">No market value history available for this player yet.<br>
      Current value: <b style="color:var(--ink)">${fmtM(PLAYER.bio.market_value_eur)}</b></div>`;
    return;
  }
  fetch(`data/valuations/${PLAYER.bio.base_id}.json`).then(r=>r.ok?r.json():null).then(d=>{
    if(!d || !d.dates || !d.dates.length){ renderMVEmpty(); return; }
    VALUATIONS = d;
    const ranges = [['1y','1Y'],['3y','3Y'],['5y','5Y'],['all','All']];
    $('mv-range').innerHTML = ranges.map(([k,l])=>`<button class="rbtn ${k===MV_RANGE?'on':''}" data-r="${k}" onclick="setMVRange('${k}')">${l}</button>`).join('');
    $('mv-body').innerHTML = `<div class="mv-head">
        <div class="mv-now tnum" id="mv-now"></div><div class="mv-delta" id="mv-delta"></div>
        <div class="mv-date" id="mv-date"></div>
      </div>
      <div class="mv-wrap"><canvas id="mv-canvas" width="1100" height="260"></canvas><div class="mv-tip" id="mv-tip"></div>
        <div class="mv-callout" id="mv-callout"><div class="mv-callout-box"><div class="mv-callout-val" id="mv-callout-val"></div><div class="mv-callout-lbl">Current</div></div></div>
      </div>`;
    drawMV();
    const c=$('mv-canvas');
    c.addEventListener('mousemove', e=>{
      if(!MV_PTS.length) return;
      const rect=c.getBoundingClientRect();
      const mx=(e.clientX-rect.left)*(c.width/rect.width);
      let best=0,bd=Infinity;
      MV_PTS.forEach((p,i)=>{ const dd=Math.abs(p.x-mx); if(dd<bd){bd=dd;best=i;} });
      drawMV(best);
      showMVTip(e,MV_PTS[best],MV_PTS[best-1]);
    });
    c.addEventListener('mouseleave', ()=>{ drawMV(); $('mv-tip').style.opacity=0; });
  }).catch(renderMVEmpty);
}
function renderMVEmpty(){
  $('mv-body').innerHTML = `<div class="empty-state">No market value history available for this player yet.<br>
    Current value: <b style="color:var(--ink)">${fmtM(PLAYER.bio.market_value_eur)}</b></div>`;
}
function setMVRange(r){ MV_RANGE=r; document.querySelectorAll('.rbtn').forEach(b=>b.classList.toggle('on',b.dataset.r===r)); drawMV(); }
function rangedSeries(){
  const pts = VALUATIONS.dates.map((d,i)=>({d,v:VALUATIONS.values[i],
    lo:VALUATIONS.lower?VALUATIONS.lower[i]:null, hi:VALUATIONS.upper?VALUATIONS.upper[i]:null})).filter(p=>p.v!=null);
  if(MV_RANGE==='all') return pts;
  const years = {'1y':1,'3y':3,'5y':5}[MV_RANGE];
  const cutoff = new Date(); cutoff.setFullYear(cutoff.getFullYear()-years);
  return pts.filter(p=>new Date(p.d)>=cutoff);
}
function showMVTip(e,pt,prevPt){
  const tip=$('mv-tip'); const wrap=$('mv-canvas').parentElement.getBoundingClientRect();
  let deltaHtml = '';
  if(prevPt && prevPt.v){
    const d = pt.v-prevPt.v, pct = d/prevPt.v*100;
    deltaHtml = `<div class="mvt-delta" style="color:${d>=0?'#5fd98a':'#ff8a8a'}">${d>=0?'▲':'▼'} ${Math.abs(pct).toFixed(1)}%</div>`;
  }
  tip.innerHTML = `<b>${fmtM(pt.v)}</b>${deltaHtml}<div style="opacity:.65;margin-top:1px">${pt.d}</div>`;
  tip.style.left=(e.clientX-wrap.left)+'px'; tip.style.top=(e.clientY-wrap.top)+'px'; tip.style.opacity=1;
}
// Catmull-Rom -> cubic Bezier smoothing, tension 1/6 (standard conversion).
// moveToStart=false continues the current subpath instead of jumping to pts[0]
// (needed to trace a closed hi/lo confidence band as one continuous path).
function smoothPath(ctx, pts, moveToStart){
  if(moveToStart===undefined) moveToStart=true;
  if(pts.length<3){ pts.forEach((p,i)=> (i||!moveToStart)?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); return; }
  if(moveToStart) ctx.moveTo(pts[0].x,pts[0].y); else ctx.lineTo(pts[0].x,pts[0].y);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    ctx.bezierCurveTo(p1.x+(p2.x-p0.x)/6, p1.y+(p2.y-p0.y)/6, p2.x-(p3.x-p1.x)/6, p2.y-(p3.y-p1.y)/6, p2.x, p2.y);
  }
}
function drawMV(hoverIdx){
  const c=$('mv-canvas'); if(!c) return;
  const series=rangedSeries(); if(series.length<2) return;
  const dpr=window.devicePixelRatio||1, cssW=c.clientWidth||1100, cssH=c.clientHeight||260;
  if(c.width!==Math.round(cssW*dpr)||c.height!==Math.round(cssH*dpr)){ c.width=Math.round(cssW*dpr); c.height=Math.round(cssH*dpr); }
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cssW,cssH);
  const PAD={l:4,r:120,t:16,b:22};
  const hasBand = series.some(p=>p.lo!=null && p.hi!=null);
  const vals=series.map(p=>p.v);
  let vmin=Math.min(...vals), vmax=Math.max(...vals);
  if(hasBand){ vmin=Math.min(vmin,...series.filter(p=>p.lo!=null).map(p=>p.lo)); vmax=Math.max(vmax,...series.filter(p=>p.hi!=null).map(p=>p.hi)); }
  vmin*=0.92; vmax*=1.06;
  const x=i=> PAD.l + i/(series.length-1)*(cssW-PAD.l-PAD.r);
  const y=v=> cssH-PAD.b - (v-vmin)/(vmax-vmin)*(cssH-PAD.t-PAD.b);
  MV_PTS = series.map((p,i)=>({x:x(i),y:y(p.v),...p}));

  // gridlines
  ctx.strokeStyle='#eef0ed'; ctx.lineWidth=1;
  for(let g=0; g<=3; g++){ const gy=PAD.t+(cssH-PAD.t-PAD.b)*g/3; ctx.beginPath(); ctx.moveTo(PAD.l,gy); ctx.lineTo(cssW-PAD.r,gy); ctx.stroke(); }

  // confidence band (lower/upper bound), smoothed
  if(hasBand){
    const hiPts = series.map((p,i)=>({x:x(i),y:y(p.hi!=null?p.hi:p.v)}));
    const loPts = series.map((p,i)=>({x:x(i),y:y(p.lo!=null?p.lo:p.v)}));
    ctx.beginPath();
    smoothPath(ctx,hiPts,true);
    smoothPath(ctx,[...loPts].reverse(),false);
    ctx.closePath(); ctx.fillStyle='rgba(179,28,16,0.08)'; ctx.fill();
  }

  // area fill under the main line
  const grad=ctx.createLinearGradient(0,PAD.t,0,cssH-PAD.b);
  grad.addColorStop(0,'rgba(179,28,16,0.22)'); grad.addColorStop(1,'rgba(179,28,16,0.0)');
  ctx.beginPath(); ctx.moveTo(MV_PTS[0].x,cssH-PAD.b);
  smoothPath(ctx,MV_PTS);
  ctx.lineTo(MV_PTS[MV_PTS.length-1].x,cssH-PAD.b); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();

  // smoothed line with a soft glow
  ctx.save();
  ctx.shadowColor='rgba(179,28,16,0.35)'; ctx.shadowBlur=6; ctx.shadowOffsetY=2;
  ctx.beginPath(); smoothPath(ctx,MV_PTS);
  ctx.strokeStyle='#b31c10'; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
  ctx.restore();

  // x labels (first/last)
  ctx.fillStyle='#878787'; ctx.font='500 10px "Roboto",system-ui'; ctx.textBaseline='top';
  ctx.textAlign='left'; ctx.fillText(series[0].d, PAD.l, cssH-18);
  ctx.textAlign='right'; ctx.fillText(series[series.length-1].d, cssW-PAD.r, cssH-18);

  // endpoint marker (always visible, pulses attention to the current value)
  const endP = MV_PTS[MV_PTS.length-1];
  ctx.beginPath(); ctx.arc(endP.x,endP.y,3.5,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle='#b31c10'; ctx.stroke();

  if(hoverIdx!=null){
    const p=MV_PTS[hoverIdx];
    ctx.beginPath(); ctx.moveTo(p.x,PAD.t); ctx.lineTo(p.x,cssH-PAD.b); ctx.strokeStyle='rgba(17,21,26,0.18)'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x,p.y,5.5,0,Math.PI*2); ctx.fillStyle='#b31c10'; ctx.fill();
    ctx.lineWidth=2.5; ctx.strokeStyle='#fff'; ctx.stroke();
  }

  // floating "current value" callout, anchored to the endpoint
  const callout=$('mv-callout');
  if(callout){
    callout.style.left=endP.x+'px'; callout.style.top=endP.y+'px';
    $('mv-callout-val').textContent = fmtM(endP.v);
    requestAnimationFrame(()=>callout.classList.add('show'));
  }

  const last=series[series.length-1], prev=series[Math.max(0,series.length-2)];
  $('mv-now').textContent = fmtM(last.v);
  $('mv-date').textContent = 'as of '+last.d;
  const delta = last.v-prev.v, pct = prev.v?(delta/prev.v*100):0;
  const de=$('mv-delta'); de.className='mv-delta '+(delta>=0?'up':'down');
  de.textContent = (delta>=0?'▲ ':'▼ ')+Math.abs(pct).toFixed(1)+'%';
}

/* ══════════════ HEAT MAP ══════════════ */
function drawPitchLines(ctx,W,H){
  const cx=x=>x/100*W, cy=y=>y/100*H;
  ctx.strokeStyle='rgba(255,255,255,0.38)'; ctx.lineWidth=1.6;
  ctx.strokeRect(2,2,W-4,H-4);
  ctx.beginPath(); ctx.moveTo(W/2,2); ctx.lineTo(W/2,H-2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H/2,W*0.082,0,Math.PI*2); ctx.stroke();
  [[cx(0),cy(21.1),cx(16.5),cy(57.8)],[cx(0),cy(36.8),cx(5.5),cy(26.4)],
   [cx(83.5),cy(21.1),cx(16.5),cy(57.8)],[cx(94.5),cy(36.8),cx(5.5),cy(26.4)]].forEach(a=>ctx.strokeRect(...a));
  ctx.beginPath(); ctx.arc(cx(11.5),cy(50),W*0.082,-0.9,0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx(88.5),cy(50),W*0.082,Math.PI-0.9,Math.PI+0.9); ctx.stroke();
}
function drawPitchBg(ctx,W,H){
  ctx.fillStyle='#163a24'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){ ctx.fillStyle = i%2===0 ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.04)'; ctx.fillRect(i*W/10,0,W/10,H); }
  drawPitchLines(ctx,W,H);
}
function renderHeat(){
  const s = PLAYER.heatmap_summary;
  const thirds=[['DEF',s.def_third],['MID',s.mid_third],['ATT',s.att_third]];
  $('heat-side').innerHTML = `
    <div class="mside-stat"><span class="mside-lbl">Touches</span><span class="mside-val">${fmtNum(s.points)}</span></div>
    <div class="mside-stat"><span class="mside-lbl">Avg Position (x)</span><span class="mside-val">${fmtNum(s.x_avg,1)}</span></div>
    <div class="mside-stat"><span class="mside-lbl">Left / Right</span><span class="mside-val">${fmtNum(s.left_half,0)}% / ${fmtNum(s.right_half,0)}%</span></div>
    <div style="margin-top:6px">
      <div class="mside-lbl" style="margin-bottom:8px">Pitch Thirds</div>
      <div class="third-bars">${thirds.map(([l,v])=>`
        <div class="third-row"><span class="third-lbl">${l}</span>
          <div class="third-track"><div class="third-fill" style="width:${v||0}%"></div></div>
          <span class="third-pct">${fmtNum(v,0)}%</span></div>`).join('')}</div>
    </div>`;
  drawHeat();
}
// Thermal ramp: deep blue (cold/empty) -> green -> yellow -> orange -> red (hot).
// Interpolated continuously so density blobs blend smoothly instead of banding.
const THERMAL_STOPS = [
  [0.00, 10, 40, 90],   [0.22, 20, 110, 90],  [0.46, 140, 205, 60],
  [0.68, 250, 210, 40], [0.85, 245, 130, 30], [1.00, 225, 35, 35],
];
function thermalColor(t){
  t = Math.max(0, Math.min(1, t));
  for(let i=0;i<THERMAL_STOPS.length-1;i++){
    const [t0,r0,g0,b0]=THERMAL_STOPS[i], [t1,r1,g1,b1]=THERMAL_STOPS[i+1];
    if(t>=t0 && t<=t1){
      const f=(t-t0)/(t1-t0||1);
      return [Math.round(r0+(r1-r0)*f), Math.round(g0+(g1-g0)*f), Math.round(b0+(b1-b0)*f)];
    }
  }
  return THERMAL_STOPS[THERMAL_STOPS.length-1].slice(1);
}
function drawHeat(){
  const c=$('heat-canvas'); if(!c) return;
  const dpr=window.devicePixelRatio||1, cssW=c.clientWidth||900, cssH=cssW*(580/900);
  c.style.height=cssH+'px';
  if(c.width!==Math.round(cssW*dpr)||c.height!==Math.round(cssH*dpr)){ c.width=Math.round(cssW*dpr); c.height=Math.round(cssH*dpr); }
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=cssW,H=cssH; drawPitchBg(ctx,W,H);
  const pts = PLAYER.heatmap; if(!pts.length) return;

  // Bin into a low-res grid, paint each cell at full opacity scaled by density
  // on an offscreen canvas, then draw it back upscaled with smoothing on —
  // the browser's own bilinear upscale is what produces the soft thermal blobs.
  const GX=48, GY=32, grid=new Array(GX*GY).fill(0);
  pts.forEach(([x,y])=>{ const gx=Math.min(GX-1,Math.floor(x/100*GX)), gy=Math.min(GY-1,Math.floor(y/100*GY)); grid[gy*GX+gx]++; });
  // light blur pass on the grid itself (3x3 box blur) so neighboring cells bleed together
  const blurred = new Array(GX*GY).fill(0);
  for(let gy=0;gy<GY;gy++) for(let gx=0;gx<GX;gx++){
    let sum=0, n=0;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      const nx=gx+dx, ny=gy+dy;
      if(nx>=0&&nx<GX&&ny>=0&&ny<GY){ sum+=grid[ny*GX+nx]; n++; }
    }
    blurred[gy*GX+gx]=sum/n;
  }
  const maxC = Math.max(...blurred,1);
  const off = document.createElement('canvas'); off.width=GX; off.height=GY;
  const octx = off.getContext('2d');
  for(let gy=0;gy<GY;gy++) for(let gx=0;gx<GX;gx++){
    const t = blurred[gy*GX+gx]/maxC; if(t<=0.02) continue;
    const [r,g,b] = thermalColor(t);
    octx.fillStyle = `rgba(${r},${g},${b},${Math.min(0.92,0.15+t*0.85).toFixed(2)})`;
    octx.fillRect(gx,gy,1,1);
  }
  ctx.save();
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.globalAlpha = 0.88;
  ctx.drawImage(off, 0,0,GX,GY, 0,0,W,H);
  ctx.restore();
  drawPitchLines(ctx,W,H);

  // average position marker
  const s=PLAYER.heatmap_summary;
  if(s.x_avg!=null){
    const px=s.x_avg/100*W, py=s.y_avg/100*H;
    ctx.beginPath(); ctx.arc(px,py,6,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(px,py,6,0,Math.PI*2); ctx.strokeStyle='#11151a'; ctx.lineWidth=2.5; ctx.stroke();
  }

  c._heatMeta = {grid, GX, GY, W, H, total:pts.length};
  if(!c._hov){
    c._hov=true;
    c.addEventListener('mousemove',e=>{
      const meta=c._heatMeta; if(!meta) return;
      const rect=c.getBoundingClientRect();
      const mx=(e.clientX-rect.left), my=(e.clientY-rect.top);
      const gx=Math.min(meta.GX-1,Math.max(0,Math.floor(mx/meta.W*meta.GX)));
      const gy=Math.min(meta.GY-1,Math.max(0,Math.floor(my/meta.H*meta.GY)));
      const v=meta.grid[gy*meta.GX+gx]||0;
      const tip=$('heat-tip'); if(!tip) return;
      const pct = meta.total? (v/meta.total*100) : 0;
      tip.innerHTML = `<b>${v}</b> touch${v===1?'':'es'} here<br>${pct.toFixed(1)}% of total`;
      const wrap=c.parentElement.getBoundingClientRect();
      tip.style.left=(e.clientX-wrap.left+12)+'px'; tip.style.top=(e.clientY-wrap.top-10)+'px'; tip.style.opacity=v?1:0;
    });
    c.addEventListener('mouseleave',()=>{ const tip=$('heat-tip'); if(tip) tip.style.opacity=0; });
  }
}

/* ══════════════ SHOT MAP ══════════════ */
const SHOT_CFG = {
  goal:   {label:'Goal',       color:'#0ca30c', test:s=>s.is_goal},
  saved:  {label:'On Target',  color:'#2a78d6', test:s=>!s.is_goal && s.on_target && !s.blocked},
  blocked:{label:'Blocked',    color:'#9aa0a2', test:s=>!s.is_goal && s.blocked},
  miss:   {label:'Off Target', color:'#d03b3b', test:s=>!s.is_goal && !s.on_target && !s.blocked},
};
function classify(s){ for(const k in SHOT_CFG){ if(k!=='miss' && SHOT_CFG[k].test(s)) return k; } return 'miss'; }
function shotRadius(xg){ return 3.5 + Math.sqrt(Math.max(xg||0.01,0.01))*17; }
function renderShotFilters(){
  $('shot-filters').innerHTML = Object.entries(SHOT_CFG).map(([k,cfg])=>{
    const n = PLAYER.shots.filter(s=>classify(s)===k).length;
    return `<div class="sf-chip ${SHOT_FILTERS[k]?'on':''}" onclick="toggleShotFilter('${k}')">
      <span class="sw" style="background:${cfg.color}"></span>${cfg.label} (${n})</div>`;
  }).join('');
  const sum = PLAYER.shot_summary;
  const perShot = sum.total ? sum.xg_total/sum.total : null;
  $('shot-stats').innerHTML = [
    ['Shots', fmtNum(sum.total)],
    ['Goals', fmtNum(sum.goals)],
    ['xG', fmtNum(sum.xg_total,2)],
    ['xG / Shot', fmtNum(perShot,2)],
    ['xGOT', fmtNum(sum.xgot_total,2)],
    ['On Target', fmtNum(sum.on_target)],
  ].map(([l,v])=>`<div class="shot-stat-tile"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
  $('shot-side').innerHTML = `
    <div class="mside-stat"><span class="mside-lbl">Inside Box</span><span class="mside-val">${fmtNum(sum.inside_box)}</span></div>
    <div class="mside-stat"><span class="mside-lbl">Shot Accuracy</span><span class="mside-val">${sum.total?fmtNum(sum.on_target/sum.total*100,0)+'%':'—'}</span></div>
    <div class="mside-stat"><span class="mside-lbl">Conversion</span><span class="mside-val">${sum.total?fmtNum(sum.goals/sum.total*100,0)+'%':'—'}</span></div>
    <div class="mside-stat"><span class="mside-lbl">Left Foot</span><span class="mside-val">${fmtNum(sum.left_foot)}</span></div>
    <div class="mside-stat"><span class="mside-lbl">Right Foot</span><span class="mside-val">${fmtNum(sum.right_foot)}</span></div>
    <div class="mside-stat"><span class="mside-lbl">Headers</span><span class="mside-val">${fmtNum(sum.header)}</span></div>
  `;
  const dots = [0.05,0.3,0.7].map(xg=>{
    const r = shotRadius(xg)*0.78;
    return `<span class="lg-dot" style="width:${(r*2).toFixed(0)}px;height:${(r*2).toFixed(0)}px"></span>`;
  }).join('');
  $('shot-legend').innerHTML = `<div class="lg-item">Low xG</div>${dots}<div class="lg-item">High xG</div>`;
}
function toggleShotFilter(k){ SHOT_FILTERS[k]=!SHOT_FILTERS[k]; renderShotFilters(); drawShots(); }
function drawShots(){
  const c=$('shot-canvas'); if(!c) return;
  const dpr=window.devicePixelRatio||1, cssW=c.clientWidth||760, cssH=cssW*(320/760);
  c.style.height=cssH+'px';
  if(c.width!==Math.round(cssW*dpr)||c.height!==Math.round(cssH*dpr)){ c.width=Math.round(cssW*dpr); c.height=Math.round(cssH*dpr); }
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=cssW,H=cssH;
  // tight crop on the penalty box, true-to-scale: pitch x in [X0,X1] (goal end) mapped to canvas height,
  // pitch y (0-100, pitch width) mapped to canvas width — goal sits at the top edge.
  const X0=78, X1=101.8;
  const cy = x => H - (x-X0)/(X1-X0)*H;
  const cx = y => y/100*W;
  ctx.fillStyle='#163a24'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<6;i++){ ctx.fillStyle = i%2===0 ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.035)'; ctx.fillRect(0,i*H/6,W,H/6); }
  ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1.8;
  // penalty box + six-yard box
  ctx.strokeRect(cx(21.1),cy(83.5),cx(78.9)-cx(21.1),cy(100)-cy(83.5));
  ctx.strokeRect(cx(36.8),cy(94.5),cx(63.2)-cx(36.8),cy(100)-cy(94.5));
  // D arc at the edge of the box
  ctx.beginPath(); ctx.arc(cx(50),cy(88.5),W*0.155,Math.PI*0.14,Math.PI*0.86); ctx.stroke();
  // penalty spot
  ctx.beginPath(); ctx.arc(cx(50),cy(88.5),2.6,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.fill();
  // goal frame
  const gx0=cx(44.2), gx1=cx(55.8), gy=cy(100);
  ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fillRect(gx0,gy-18,gx1-gx0,18);
  ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fillRect(gx0,gy-3,gx1-gx0,3);

  // Shots taken from outside the visible box crop (x < X0) are excluded rather
  // than clamped to the bottom edge — clamping kept their real (often wide)
  // lateral position, which looked like stray marks scattered off to the
  // sides with no pitch context. Total counts in the stat tiles above still
  // reflect every shot regardless of origin; only the plot itself is cropped.
  const shots = PLAYER.shots.map(s=>({...s,_cls:classify(s)})).filter(s=>SHOT_FILTERS[s._cls] && s.x!=null && s.x>=X0);
  const order=['miss','blocked','saved','goal'];
  const tipTargets=[];

  // trajectory lines first (under the markers) — real endpoint (ex/ey) where
  // Fotmob provides one (most non-goals); goals get a stylized line into the
  // goal mouth since Fotmob never gives a precise net-crossing point for them
  const LINE_ALPHA = {goal:0.5, saved:0.4, blocked:0.22, miss:0.3};
  order.forEach(cls=>{
    shots.filter(s=>s._cls===cls).forEach(s=>{
      let end=null;
      if(s.ex!=null && s.ey!=null) end={x:s.ex,y:s.ey};
      else if(s.is_goal) end={x:100.3, y:Math.max(44.5,Math.min(55.5,s.y))};
      if(!end) return;
      const px0=cx(s.y), py0=cy(Math.min(s.x,X1-0.2));
      const px1=cx(end.y), py1=cy(end.x);
      ctx.beginPath(); ctx.moveTo(px0,py0); ctx.lineTo(px1,py1);
      ctx.strokeStyle=SHOT_CFG[cls].color; ctx.lineWidth=cls==='goal'?1.6:1;
      ctx.globalAlpha=LINE_ALPHA[cls]; ctx.stroke(); ctx.globalAlpha=1;
    });
  });

  order.forEach(cls=>{
    shots.filter(s=>s._cls===cls).forEach(s=>{
      const px=cx(s.y), py=cy(Math.min(s.x,X1-0.2));
      const r = shotRadius(s.xg);
      const cfg=SHOT_CFG[cls];
      ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2);
      if(cls==='miss'){ ctx.strokeStyle=cfg.color; ctx.lineWidth=1.8; ctx.globalAlpha=0.8; ctx.stroke(); }
      else if(cls==='blocked'){ ctx.fillStyle=cfg.color; ctx.globalAlpha=0.55; ctx.fill(); }
      else{ ctx.fillStyle=cfg.color; ctx.globalAlpha = cls==='goal'?0.95:0.72; ctx.fill();
        if(cls==='goal'){ ctx.lineWidth=1.6; ctx.strokeStyle='#fff'; ctx.globalAlpha=1; ctx.stroke(); } }
      ctx.globalAlpha=1;
      tipTargets.push({px,py,r:Math.max(r,7),s});
    });
  });
  c._tipTargets = tipTargets;
  if(!c._hov){
    c._hov=true;
    c.addEventListener('mousemove',e=>{
      const rect=c.getBoundingClientRect();
      const mx=(e.clientX-rect.left)*(c.width/rect.width)/dpr, my=(e.clientY-rect.top)*(c.height/rect.height)/dpr;
      const hit=(c._tipTargets||[]).find(t=>Math.hypot(t.px-mx,t.py-my)<=t.r+2);
      const tip=$('shot-side').parentElement.querySelector('.shot-tip') || makeShotTip();
      if(hit){
        const s=hit.s;
        tip.innerHTML = `<b>${SHOT_CFG[s._cls].label}</b> · ${s.min}'<br>xG ${fmtNum(s.xg,2)} · ${s.foot||''}<br>${s.situation||''}`;
        const wrap=c.parentElement.getBoundingClientRect();
        tip.style.left=(e.clientX-wrap.left+12)+'px'; tip.style.top=(e.clientY-wrap.top-10)+'px'; tip.style.opacity=1;
      } else { tip.style.opacity=0; }
    });
    c.addEventListener('mouseleave',()=>{ const tip=c.parentElement.querySelector('.shot-tip'); if(tip) tip.style.opacity=0; });
  }
}
function makeShotTip(){
  const wrap = $('shot-canvas').parentElement; wrap.style.position='relative';
  const tip=document.createElement('div'); tip.className='shot-tip'; wrap.appendChild(tip); return tip;
}

/* ══════════════ SCROLL SPY ══════════════ */
function initScrollSpy(){
  const secs=['sec-value','sec-scout','sec-heat','sec-shots'].map(id=>$(id)).filter(Boolean);
  const links=[...document.querySelectorAll('.subnav a')];
  window.addEventListener('scroll',debounce(()=>{
    let cur=0;
    secs.forEach((s,i)=>{ if(s.getBoundingClientRect().top<140) cur=i; });
    links.forEach((l,i)=>l.classList.toggle('on',i===cur));
  },50));
}

/* ══════════════ SEARCH ══════════════ */
let SEARCH_IDX=null;
function loadSearchIdx(){ if(SEARCH_IDX) return Promise.resolve(SEARCH_IDX);
  return fetch('data/fotmob_index.json').then(r=>r.json()).then(d=>{ SEARCH_IDX=d; return d; }); }
const inp=$('search-input'), pop=$('search-pop');
inp.addEventListener('focus',()=>loadSearchIdx());
inp.addEventListener('input',()=>{
  const q=inp.value.trim().toLowerCase();
  if(q.length<2){ pop.classList.remove('show'); return; }
  loadSearchIdx().then(idx=>{
    const res = idx.filter(p=>p.name && p.name.toLowerCase().includes(q)).slice(0,10);
    pop.innerHTML = res.map(p=>`<div class="sr-row" onclick="location.href='fotmob_player.html?id=${p.id}'">
        <div><div class="sr-name">${p.name}</div><div class="sr-sub">${p.team||''} · ${p.league||''} · ${p.pos||''}</div></div>
        <div class="sr-mv">${fmtM(p.mv)}</div>
      </div>`).join('') || `<div class="sr-row" style="color:var(--muted)">No players found</div>`;
    pop.classList.add('show');
  });
});
document.addEventListener('click',e=>{ if(!e.target.closest('.nav-search')) pop.classList.remove('show'); });
</script>
